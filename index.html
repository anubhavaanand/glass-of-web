<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aave Glass Web Specification</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hidden Global SVG Filters for Cross-Browser Optical Refraction -->
  <svg class="svg-filters-root" aria-hidden="true">
    <defs>
      <filter id="hero-filter" primitiveUnits="userSpaceOnUse" filterUnits="userSpaceOnUse" x="0" y="0">
        <feImage id="feImg-hero" href="" result="DISPLACEMENT_MAP" />
        <feDisplacementMap in="SourceGraphic" in2="DISPLACEMENT_MAP" scale="42" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="switch-filter" primitiveUnits="userSpaceOnUse" filterUnits="userSpaceOnUse" x="0" y="0">
        <feImage id="feImg-switch" href="" result="DISPLACEMENT_MAP" />
        <feDisplacementMap in="SourceGraphic" in2="DISPLACEMENT_MAP" scale="32" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="slider-filter" primitiveUnits="userSpaceOnUse" filterUnits="userSpaceOnUse" x="0" y="0">
        <feImage id="feImg-slider" href="" result="DISPLACEMENT_MAP" />
        <feDisplacementMap in="SourceGraphic" in2="DISPLACEMENT_MAP" scale="30" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="toggle-filter" primitiveUnits="userSpaceOnUse" filterUnits="userSpaceOnUse" x="0" y="0">
        <feImage id="feImg-toggle" href="" result="DISPLACEMENT_MAP" />
        <feDisplacementMap in="SourceGraphic" in2="DISPLACEMENT_MAP" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="app-layout">
    <!-- Hero Refraction Stage -->
    <div class="hero-stage" id="heroStage">
      <div class="hero-content-base">
        <h1 class="hero-headline">Building Glass<br>for the Web</h1>
        <p class="hero-subline">Real optical refraction through live rendered HTML</p>
      </div>

      <div class="hero-lens-capsule" id="heroLens">
        <div class="lens-refraction-container">
          <div class="hero-content-refracted" id="refractedHeroLayer">
            <h1 class="hero-headline text-refracted">Building Glass<br>for the Web</h1>
            <p class="hero-subline text-refracted">Real optical refraction through live rendered HTML</p>
          </div>
        </div>
        <div class="lens-specular-rim"></div>
      </div>
    </div>

    <!-- Components Grid -->
    <div class="components-grid">
      <!-- Switch -->
      <div class="aave-switch" id="aaveSwitch">
        <div class="switch-track-bg"><span>OFF</span><span>ON</span></div>
        <div class="switch-glass-thumb" id="switchThumb">
          <div class="thumb-refraction-wrap">
            <div class="switch-track-refracted"><span>OFF</span><span>ON</span></div>
          </div>
          <div class="thumb-specular-rim"></div>
        </div>
      </div>

      <!-- Slider -->
      <div class="aave-slider-container" id="sliderContainer">
        <div class="slider-groove"><div class="slider-fill-bar" id="sliderFillBar"></div></div>
        <div class="slider-glass-thumb" id="sliderGlassThumb">
          <div class="slider-thumb-refraction">
            <div class="slider-fill-duplicate" id="sliderFillDuplicate"></div>
          </div>
          <div class="thumb-specular-rim"></div>
          <span class="slider-readout" id="sliderReadout">65%</span>
        </div>
      </div>

      <!-- Toggle Group -->
      <div class="aave-toggle-group" id="toggleGroup">
        <button class="toggle-option active">Hubs</button>
        <button class="toggle-option">Spokes</button>
        <button class="toggle-option">Reserves</button>
        <button class="toggle-option">Chains</button>
        <div class="toggle-glass-pill" id="togglePill">
          <div class="toggle-pill-refraction">
            <div class="toggle-options-refracted" id="duplicateOptions">
              <span>Hubs</span><span>Spokes</span><span>Reserves</span><span>Chains</span>
            </div>
          </div>
          <div class="pill-specular-rim"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="glass.js"></script>
</body>
</html>
